<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento Legislativo SPD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Sistema visual SPD (plantilla Plan Maestro 2026–2029): barra lateral azul institucional, banda de resumen,
   tarjetas sobrias y matriz de avance por etapas como pieza central. */
:root{
  /* Colores oficiales Gobierno de Chile (Manual de Normas Gráficas 2026): azul Pantone 293 C #0F69B4 y rojo Pantone 185 C #EB3C46 */
  --gob-red:#eb3c46; --gob-blue:#0f69b4;
  --c-blue:#0f69b4; --c-blue-700:#0b5592; --c-blue-900:#08355d; --c-blue-950:#06294a; --c-blue-soft:#e6f0fa;
  --c-red:#d52b34; --c-red-soft:#fbe9ea;
  --c-orange:#d2691e; --c-orange-soft:#fcecdf;
  --c-ok:#1f8a5b; --c-ok-soft:#e4f3ec;
  --c-amber:#b57b06; --c-amber-soft:#fbf0db;
  --c-slate:#7b899e; --c-slate-soft:#eef1f5;
  --bg:#eaeef3; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eef2f7;
  --ink:#16243b; --ink-2:#4d5d76; --ink-3:#7f8ca1; --line:#e0e6ee; --line-2:#d2dae4;
  --track-done:#0063b1; --track-todo:#d6dee8;
  --side-1:#06294a; --side-2:#08355d; --side-3:#0a3f70; --side-ink:#dce7f3; --side-ink-2:#8fb4d8;
  --shadow-sm:0 1px 2px rgba(16,38,68,.06),0 1px 3px rgba(16,38,68,.05);
  --shadow:0 2px 8px rgba(16,38,68,.07),0 8px 24px rgba(16,38,68,.06);
  --radius:12px;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --sidebar-w:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-blue:#4c9be8; --c-blue-700:#7db6ef; --c-blue-soft:#13304f;
  --c-red:#f06a70; --c-red-soft:#3a1d22; --c-orange:#f0955a; --c-orange-soft:#3a2617;
  --c-ok:#4cc08b; --c-ok-soft:#173326; --c-amber:#e0b04a; --c-amber-soft:#382c12; --c-slate:#97a5b9; --c-slate-soft:#232c39;
  --bg:#0d1520; --surface:#15202e; --surface-2:#1a2635; --surface-3:#202d3e;
  --ink:#e6edf6; --ink-2:#b4c1d2; --ink-3:#8494aa; --line:#263447; --line-2:#30415a;
  --track-done:#4c9be8; --track-todo:#33445c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --c-blue:#4c9be8; --c-blue-700:#7db6ef; --c-blue-soft:#13304f;
  --c-red:#f06a70; --c-red-soft:#3a1d22; --c-orange:#f0955a; --c-orange-soft:#3a2617;
  --c-ok:#4cc08b; --c-ok-soft:#173326; --c-amber:#e0b04a; --c-amber-soft:#382c12; --c-slate:#97a5b9; --c-slate-soft:#232c39;
  --bg:#0d1520; --surface:#15202e; --surface-2:#1a2635; --surface-3:#202d3e;
  --ink:#e6edf6; --ink-2:#b4c1d2; --ink-3:#8494aa; --line:#263447; --line-2:#30415a;
  --track-done:#4c9be8; --track-todo:#33445c; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--c-blue)}
:focus-visible{outline:2px solid var(--c-blue);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------------- layout */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);height:100%}
.sidebar{background:linear-gradient(178deg,var(--side-1) 0%,var(--side-2) 60%,var(--side-3) 100%);color:var(--side-ink);display:flex;flex-direction:column;overflow:hidden}
.sidebar__brand{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.sidebar__logo{width:100%;max-width:212px;border-radius:8px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.sidebar__k{margin-top:12px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--side-ink-2);font-weight:600}
.sidebar__v{font-size:12.5px;color:#cfe0f0;margin-top:3px;line-height:1.35}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav__group{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6f93b8;font-weight:700;padding:8px 12px 6px}
.nav__item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;color:#bcd0e6;font-size:13.5px;font-weight:500;margin-bottom:2px;line-height:1.25;text-decoration:none}
.nav__item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav__item.is-active{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.nav__num{flex:none;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11.5px;font-weight:700;font-family:var(--mono)}
.nav__item.is-active .nav__num{background:var(--gob-red);color:#fff}
.nav__badge{margin-left:auto;background:var(--gob-red);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.sidebar__foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#9bb5d1;line-height:1.55}
.src{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:16px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));min-height:64px;flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar__head{min-width:0;flex:1}
.topbar__title{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__sub{font-size:12px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corte{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.mnav{display:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.page{padding-block:22px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
.page__eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-blue);font-weight:700}
.page__title{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:5px 0 0;text-wrap:balance}
.page__lead{font-size:13.5px;color:var(--ink-2);margin:7px 0 18px;max-width:78ch;line-height:1.55}
@media (max-width:1080px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--c-blue-950);flex:none}
  .mnav a{flex:none;color:#cfe0f0;text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08)}
  .mnav a.is-active{background:var(--gob-red);color:#fff}
  .corte{display:none}
}
@media (max-width:640px){.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ---------------- piezas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);min-width:0}
.card__head{display:flex;align-items:baseline;gap:10px;padding:15px 18px 0}
.card__title{font-size:13px;font-weight:700}
.card__sub{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.card__body{padding:12px 18px 16px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:760px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.section-title{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.empty{padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.45;background:var(--slate-soft,var(--c-slate-soft));color:var(--ink-2)}
.chip .dot{width:7px;height:7px}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);text-decoration:none}
.btn:hover{border-color:var(--c-blue);color:var(--c-blue-700)}
.btn.back{color:var(--c-blue);font-weight:700}

.u-di{background:var(--c-red-soft);color:var(--c-red)} .u-su{background:var(--c-amber-soft);color:var(--c-amber)}
.u-si{background:var(--c-blue-soft);color:var(--c-blue-700)} .u-no{background:var(--c-slate-soft);color:var(--ink-3)}
.p-cri{background:var(--c-red);color:#fff} .p-alt{background:var(--c-orange);color:#fff} .p-med{background:var(--c-amber-soft);color:var(--c-amber)}
.p-baj{background:var(--c-slate-soft);color:var(--ink-2)} .p-ley{background:var(--c-ok-soft);color:var(--c-ok)} .p-des{background:var(--c-blue-soft);color:var(--c-blue-700)} .p-fue{background:var(--c-slate-soft);color:var(--ink-3)}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.prio b{font-family:var(--mono);font-weight:700}

/* ---------------- banda de resumen */
.hero{background:linear-gradient(135deg,var(--side-1) 0%,var(--side-2) 60%,var(--side-3) 100%);border-radius:18px;padding:18px 24px 20px;color:#fff;margin-bottom:16px}
.hero__top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hero__k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#9ec3ff}
.hero__t{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:3px 0 2px;text-wrap:balance}
.hero__meta{font-size:13px;color:#c9d9f2}
.hero__stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 15px;text-align:left;color:#fff}
.hstat:hover{background:rgba(255,255,255,.15)}
.hstat__n{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hstat__l{font-size:12.5px;font-weight:700;margin-top:5px;color:#e6eefb}
.hstat__s{font-size:11px;color:#a9c3e4;margin-top:2px}
@media (max-width:900px){.hero__stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hstat__n{font-size:30px}}

/* listas compactas */
.lrow{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-radius:8px;cursor:pointer;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow__main{flex:1;min-width:0}
.lrow__t{font-size:12.8px;font-weight:600;line-height:1.35}
.lrow__s{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.lrow__r{flex:none;text-align:right;font-size:12px;font-weight:700;white-space:nowrap}
.more{display:inline-block;font-size:12px;color:var(--c-blue);font-weight:700;padding:8px 6px 0;text-decoration:none}
.barrow{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 34px;align-items:center;gap:10px;padding:5px 0}
.barrow__lab{font-size:12.3px;color:var(--ink-2);font-weight:600;line-height:1.25}
.barrow__lab small{display:block;color:var(--ink-3);font-weight:500;font-size:10.5px}
.barrow__track{height:18px;background:var(--surface-3);border-radius:5px;overflow:hidden;display:flex}
.barrow__fill{height:100%}
.barrow__n{font-size:12.5px;font-weight:700;text-align:right}

/* ---------------- filtros */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button.is-on{background:var(--surface);color:var(--c-blue-700);box-shadow:var(--shadow-sm)}
.fsel{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;max-width:100%}
.fsearch{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;flex:1;min-width:180px}
.fcount{font-size:12px;color:var(--ink-3);margin-left:auto}

/* ---------------- cuadro de avance */
.matriz-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.matriz-scroll{overflow-x:auto}
table.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:980px}
.mx th{background:var(--surface-2);color:var(--ink-3);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap}
.mx thead tr:first-child th{border-bottom:1px solid var(--line);font-size:10px;color:var(--ink-2);padding-top:10px}
.mx th.g{border-left:1px solid var(--line-2)}
.mx th.left,.mx td.left{text-align:left}
.mx td{border-bottom:1px solid var(--line);padding:0;vertical-align:middle;height:52px}
.mx tbody tr{cursor:pointer}
.mx tbody tr:hover td{background:var(--c-blue-soft)}
.mx tr.grp td{height:auto;background:var(--surface-3);cursor:default;padding:7px 14px;font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:.02em}
.mx tr.grp:hover td{background:var(--surface-3)}
.mx .sticky{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.mx th.sticky{background:var(--surface-2);z-index:2}
.pname{padding:8px 12px 8px 14px;min-width:230px;max-width:300px}
.pname b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
.pname span{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.cnt{display:block;font-family:var(--mono);font-size:12px;color:var(--ink);margin-top:3px;letter-spacing:0}
.cnt.zero{color:var(--ink-3)}
/* pista de etapas: línea continua con hitos */
.st{position:relative;width:100%;height:52px;min-width:54px}
.st::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--track-todo)}
.st.first::before{left:50%} .st.last::before{right:50%}
.st.done::before,.st.cur.lineok::before{background:var(--track-done)}
.st.cur::before{background:linear-gradient(90deg,var(--track-done) 50%,var(--track-todo) 50%)}
.st.first.cur::before{background:var(--track-todo)}
.st.skip::before{background:repeating-linear-gradient(90deg,var(--track-done) 0 4px,transparent 4px 8px)}
.st i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;font-style:normal}
.st.done i{width:11px;height:11px;background:var(--track-done)}
.st.todo i{width:11px;height:11px;background:var(--surface);border:2px solid var(--track-todo)}
.st.skip i{width:16px;height:3px;border-radius:2px;background:transparent}
.st.cur i{width:30px;height:30px;background:var(--c-blue);color:#fff;font-size:11px;font-weight:800;font-family:var(--mono);box-shadow:0 0 0 4px var(--c-blue-soft)}
.st.cur.c-di i{background:var(--c-red);box-shadow:0 0 0 4px var(--c-red-soft)}
.st.cur.c-su i{background:var(--c-amber);box-shadow:0 0 0 4px var(--c-amber-soft)}
.st.stop i{width:26px;height:26px;background:var(--c-slate);color:#fff;font-size:13px;font-weight:800;box-shadow:0 0 0 4px var(--c-slate-soft)}
.st.ley i{width:26px;height:26px;background:var(--c-ok);color:#fff;font-size:12px;font-weight:800;box-shadow:0 0 0 4px var(--c-ok-soft)}
.mx td.g{border-left:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:11.5px;color:var(--ink-2);padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--mono);font-size:9.5px;font-weight:800;color:#fff}
.dias{font-size:12px;font-weight:700;padding:0 12px;text-align:right;white-space:nowrap}
.dias small{display:block;font-weight:500;color:var(--ink-3);font-size:10.5px}

/* ---------------- ficha */
.fhead{padding:18px 20px}
.fhead__eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
@media (max-width:640px){.fhead__eyebrow{flex-direction:column;align-items:flex-start;gap:3px}.fhead__eyebrow .sep{display:none}}
.fhead__t{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.2;text-wrap:balance}
.fhead__o{font-size:13px;color:var(--ink-2);line-height:1.5;max-width:100ch}
.fhead__chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tracker{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin-top:4px}
.tk{position:relative;padding:44px 6px 0;text-align:center}
.tk::before{content:"";position:absolute;top:20px;left:0;right:0;height:4px;background:var(--track-todo)}
.tk:first-child::before{left:50%} .tk:last-child::before{right:50%}
.tk.done::before{background:var(--track-done)}
.tk.cur::before{background:linear-gradient(90deg,var(--track-done) 50%,var(--track-todo) 50%)}
.tk.skip::before{background:repeating-linear-gradient(90deg,var(--track-done) 0 5px,transparent 5px 10px)}
.tk i{position:absolute;top:22px;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--track-todo);font-style:normal;display:grid;place-items:center}
.tk.done i{background:var(--track-done);border-color:var(--track-done)}
.tk.skip i{background:var(--surface);border:2px dashed var(--track-done)}
.tk.cur i{width:34px;height:34px;background:var(--c-blue);border:0;color:#fff;font-family:var(--mono);font-weight:800;font-size:12px;box-shadow:0 0 0 5px var(--c-blue-soft)}
.tk.ley i{width:30px;height:30px;background:var(--c-ok);border:0;color:#fff;font-weight:800;box-shadow:0 0 0 5px var(--c-ok-soft)}
.tk.stop i{width:30px;height:30px;background:var(--c-slate);border:0;color:#fff;font-weight:800}

<a class="saltar" href="#contenido">Saltar al contenido</a>
<div class="app">
  <aside class="sidebar">

      <img class="sidebar__logo" src="config/logo.png" alt="Subsecretaría de Prevención del Delito">
      <div class="sidebar__k">Seguimiento legislativo</div>

    <div class="sidebar__foot" id="fuentes"></div>
  </aside>

        <button type="button" id="aMenos" title="Reducir el tamaño del texto" aria-label="Reducir el tamaño del texto">A−</button>
        <button type="button" id="aMas" title="Aumentar el tamaño del texto" aria-label="Aumentar el tamaño del texto">A+</button>
        <button type="button" id="aCon" title="Alto contraste" aria-label="Alto contraste" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>

  </div>
</div>
<script>
"use strict";
/* ============================================================ datos y utilidades */
const D = {tablero: [], meta: {}, cambios: [], proyectos: null, actores: null, ind: {}, agenda: {items: [], plazos_indicaciones: []}, acot: [], calendario: {semanas: []}};
const ETAPAS = [
  {c:"1C", g:"Primer trámite", n:"Comisión"}, {c:"1S", g:"Primer trámite", n:"Sala"},
  {c:"2C", g:"Segundo trámite", n:"Comisión"}, {c:"2S", g:"Segundo trámite", n:"Sala"},
  {c:"3T", g:"Tercer trámite", n:"Cámara de origen"}, {c:"CM", g:"Comisión Mixta", n:"o insistencia"},
  {c:"TC", g:"Control y promulgación", n:"TC · veto · Ejecutivo"}, {c:"LEY", g:"Ley", n:"Publicada"}];
const VISTAS = [
  {id:"panorama", n:"Panorama", s:"Estado de todos los proyectos en una vista"},
  {id:"autoridad", n:"Resumen para autoridades", s:"Lo que hay que saber y decidir esta semana"},
  {id:"agenda", n:"Agenda de la semana", s:"Citaciones, tabla de Sala y plazos de indicaciones"},
  {id:"acot", n:"Agenda ACOT", s:"Agenda contra el Crimen Organizado y el Terrorismo"},
  {id:"urgencias", n:"Urgencias y alertas", s:"Plazos de urgencia y señales de riesgo"},
  {id:"indicaciones", n:"Indicaciones", s:"Qué se ha propuesto modificar y quién"},
  {id:"votaciones", n:"Votaciones y actores", s:"Votaciones en Sala y parlamentarios"},
  {id:"cambios", n:"Cambios recientes", s:"Lo que cambió en la tramitación"},
  {id:"leyes", n:"Leyes y despachos", s:"Proyectos que terminaron su paso por el Congreso"},
  {id:"metodologia", n:"Fuentes y método", s:"Cómo se construye cada dato"}];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = f => /^\d{4}-\d{2}-\d{2}/.test(f || "") ? `${f.slice(8,10)}-${f.slice(5,7)}-${f.slice(0,4)}${f.slice(10)}` : (f || "");
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fLarga = f => /^\d{4}-\d{2}-\d{2}/.test(f || "") ? `${+f.slice(8,10)} de ${MESES[+f.slice(5,7)-1]} de ${f.slice(0,4)}` : "";
const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const diasHasta = f => Math.round((new Date(f + "T12:00:00") - new Date(hoyISO() + "T12:00:00")) / 864e5);
const $ = s => document.querySelector(s);
const num = n => Number(n || 0).toLocaleString("es-CL");
async function cargar(ruta, defecto) {
  try { const r = await fetch(ruta, {cache: "no-store"}); if (!r.ok) throw 0; return await r.json(); } catch (e) { return defecto; }
}
let cargaProyectos = null;
function proyectos() {
  if (!cargaProyectos) cargaProyectos = cargar("data/proyectos.json", []).then(p => (D.proyectos = p));
  return cargaProyectos;
}
const proyecto = b => D.tablero.find(p => p.boletin === b);
const urgClase = u => u === "Discusión inmediata" ? "u-di" : u === "Suma" ? "u-su" : u === "Simple" ? "u-si" : "u-no";
const urgCorta = u => u === "Discusión inmediata" ? "Disc. inmediata" : u === "Sin urgencia" ? "Sin urgencia" : u;
const prioClase = n => ({"Crítica":"p-cri","Alta":"p-alt","Media":"p-med","Baja":"p-baj","Ley publicada":"p-ley","Despachado":"p-des","Fuera de tramitación":"p-fue"}[n] || "p-baj");
const prio = p => `<span class="prio ${prioClase(p.prioridad_nivel)}">${esc(p.prioridad_nivel)}${p.prioridad_indice !== "" && p.prioridad_indice != null ? ` <b>${p.prioridad_indice}</b>` : ""}</span>`;
const urg = (u, txt) => `<span class="chip ${urgClase(u)}">${esc(txt || urgCorta(u))}</span>`;
const inicial = c => !c ? "" : c.startsWith("Senado") ? "S" : c.startsWith("Cámara") ? "C" : c.startsWith("Ambas") ? "M" : "";
const ICON_AL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
const enTram = p => p.situacion === "En tramitación";
const ICON_CAL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const proxSesion = p => (p.agenda || []).filter(x => x.fecha >= hoyISO() && x.estado !== "Suspendida").sort((a, b) => (a.fecha + a.horario).localeCompare(b.fecha + b.horario))[0];
const sesionesSeguidas = () => (D.agenda.items || []).filter(x => (x.seguidos || []).length);
const ORDEN_PRIO = {"Crítica":0,"Alta":1,"Media":2,"Baja":3,"Despachado":4,"Ley publicada":5,"Fuera de tramitación":6};
const vence7 = p => enTram(p) && p.urgencia_vence_estimado && diasHasta(p.urgencia_vence_estimado) >= 0 && diasHasta(p.urgencia_vence_estimado) <= 7;
const linkFicha = b => `#p-${b}`;

/* ============================================================ navegación */
function pintarNav(actual) {
  const badge = {urgencias: D.tablero.filter(vence7).length, agenda: sesionesSeguidas().filter(x => x.fecha >= hoyISO()).length};
  $("#nav").innerHTML = `<div class="nav__group">Vistas</div>` + VISTAS.map((v, i) =>
    `<a class="nav__item ${actual === v.id ? "is-active" : ""}" href="#${v.id}"><span class="nav__num">${i + 1}</span><span>${v.n}</span>${badge[v.id] ? `<span class="nav__badge" title="${v.id === "agenda" ? "Sesiones citadas con proyectos seguidos" : "Urgencias que vencen en 7 días"}">${badge[v.id]}</span>` : ""}</a>`).join("");
  $("#mnav").innerHTML = VISTAS.map(v => `<a href="#${v.id}" class="${actual === v.id ? "is-active" : ""}">${v.n}</a>`).join("");
}
function encabezado(t, s) { $("#tTitle").textContent = t; $("#tSub").textContent = s; }
async function ruta() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "contenido") { $("#page").focus(); return; }
  if (h.startsWith("p-") && proyecto(h.slice(2))) { pintarNav(""); await vistaFicha(h.slice(2)); return pie(); }
  const v = VISTAS.find(x => x.id === h) || VISTAS[0];
  pintarNav(v.id); encabezado(v.n, v.s);
  $("#scroll").scrollTop = 0;
  await ({panorama: vistaPanorama, autoridad: vistaAutoridad, agenda: vistaAgenda, acot: vistaAcot, urgencias: vistaUrgencias, indicaciones: vistaIndicaciones, votaciones: vistaVotaciones,
    cambios: vistaCambios, leyes: vistaLeyes, metodologia: vistaMetodo})[v.id]();
  pie();
}
function pie() {
  if ($("#page .pie")) return;
  $("#page").insertAdjacentHTML("beforeend", `<footer class="pie"><span>Subsecretaría de Prevención del Delito · Ministerio de Seguridad Pública</span>
    <span>Fuentes oficiales: Senado y Cámara de Diputadas y Diputados</span><span>Datos al ${fmt(D.meta.ultima_actualizacion_datos)} · se actualiza cada hora</span>
    <a href="#metodologia">Fuentes y método</a></footer>`);
}
window.addEventListener("hashchange", ruta);

/* ============================================================ cuadro de avance */
const F = {sit: "tram", cla: "", mat: "", urg: "", prio: "", q: "", orden: "prio", acot: false};
function celdaEtapa(p, e, i) {
  const est = (p.avance_estados || {})[e.c] || "todo";
  const cls = ["st"]; if (i === 0) cls.push("first"); if (i === ETAPAS.length - 1) cls.push("last");
  const cam = (p.avance_camaras || {})[e.c] || "";
  let marca = "", tip = `${e.g} · ${e.n}`;
  if (est === "hecha") { cls.push(e.c === "LEY" ? "ley" : "done"); if (e.c === "LEY") marca = "✓"; tip += ": cumplida"; }
  else if (est === "actual") { cls.push("cur"); if (enTram(p) && p.urgencia_vigente === "Discusión inmediata") cls.push("c-di"); else if (enTram(p) && p.urgencia_vigente === "Suma") cls.push("c-su");
    marca = inicial(cam) || "•"; tip += `: etapa actual${cam ? " (" + cam + ")" : ""}${p.instancia_actual ? " · " + p.instancia_actual : ""}`; }
  else if (est === "omitida") { cls.push("skip"); tip += ": no fue necesaria"; }
  else if (est === "detenida") { cls.push("stop"); marca = "×"; tip += `: ${p.situacion.toLowerCase()} en esta etapa`; }
  else { cls.push("todo"); tip += ": pendiente"; }
  return `<td class="${i === 0 || e.c === "3T" || e.c === "TC" ? "g" : ""}"><div class="${cls.join(" ")}" title="${esc(tip)}"><i>${marca}</i></div></td>`;
}
function filtrar() {
  const q = F.q.trim().toLowerCase();
  return D.tablero.filter(p =>
    (F.sit === "todos" || (F.sit === "tram" && enTram(p)) || (F.sit === "fin" && ["Despachado al Ejecutivo","Publicado como ley"].includes(p.situacion)) ||
     (F.sit === "fuera" && ["Archivado","Retirado","Rechazado"].includes(p.situacion))) &&

async function vistaIndicaciones() {
  const l = D.tablero.filter(p => p.n_indicaciones_senado).sort((a, b) => b.n_indicaciones_senado - a.n_indicaciones_senado);
  const tot = l.reduce((s, p) => s + p.n_indicaciones_senado, 0), eje = l.reduce((s, p) => s + p.n_indicaciones_senado_ejecutivo, 0);
  const max = Math.max(1, ...l.map(p => p.n_indicaciones_senado));
  $("#page").innerHTML = `<div class="page__eyebrow">Indicaciones</div><h1 class="page__title">Qué se ha propuesto modificar y quién lo propone</h1>
    <p class="page__lead">${num(tot)} indicaciones presentadas en el Senado en ${l.length} proyectos; ${num(eje)} son del Ejecutivo. Al abrir un proyecto, la pestaña Indicaciones muestra el texto de cada una, filtrable por artículo y autor.</p>
    <div class="grid g2"><div class="card"><div class="card__head"><span class="card__title">Proyectos con más indicaciones</span></div><div class="card__body">
      ${l.map(p => `<div class="barrow" style="cursor:pointer" data-b="${esc(p.boletin)}"><div class="barrow__lab">${esc(p.nombre_corto)}<small>${esc(p.boletin)}</small></div><div class="barrow__track">
        <div class="barrow__fill" style="width:${100 * p.n_indicaciones_senado_ejecutivo / max}%;background:var(--c-blue)"></div><div class="barrow__fill" style="width:${100 * (p.n_indicaciones_senado - p.n_indicaciones_senado_ejecutivo) / max}%;background:var(--c-slate)"></div></div><div class="barrow__n tnum">${p.n_indicaciones_senado}</div></div>`).join("")}
      <div class="small muted" style="margin-top:10px"><span class="dot" style="background:var(--c-blue)"></span> Ejecutivo &nbsp; <span class="dot" style="background:var(--c-slate)"></span> Parlamentarias y otras</div></div></div>
    <div class="card" id="autores"><div class="loading">Cargando autores…</div></div></div>`;
  document.querySelectorAll("[data-b]").forEach(r => r.addEventListener("click", () => { tabFicha = "ind"; location.hash = linkFicha(r.dataset.b); }));
  if (!D.actores) D.actores = await cargar("data/actores.json", {});
  const a = (D.actores.autores_indicaciones_senado || []).slice(0, 25), mx = Math.max(1, ...a.map(x => x.n_indicaciones));
  $("#autores").innerHTML = `<div class="card__head"><span class="card__title">Autores con más indicaciones</span><span class="card__sub">en los proyectos seguidos</span></div><div class="card__body">${a.map(x =>
    `<div class="barrow"><div class="barrow__lab">${esc(x.nombre)}<small>${x.n_proyectos} proyectos</small></div><div class="barrow__track"><div class="barrow__fill" style="width:${100 * x.n_indicaciones / mx}%;background:${x.nombre.startsWith("Presidente") ? "var(--c-blue)" : "var(--c-slate)"}"></div></div><div class="barrow__n tnum">${x.n_indicaciones}</div></div>`).join("")}</div>`;
}

/* ============================================================ vista 4: votaciones y actores */
async function vistaVotaciones() {
  $("#page").innerHTML = `<div class="loading">Cargando votaciones…</div>`;
  await proyectos();
  if (!D.actores) D.actores = await cargar("data/actores.json", {});
  const votos = [];
  (D.proyectos || []).forEach(p => { (p.votaciones || []).forEach(v => votos.push({p, v, c: "Senado"})); (p.votaciones_camara || []).forEach(v => votos.push({p, v, c: "Cámara"})); });
  votos.sort((a, b) => b.v.fecha.localeCompare(a.v.fecha));
  const sesiones = [];                    // agrupa las votaciones de un mismo proyecto, día y cámara
  votos.forEach(x => { const k = x.p.boletin + x.v.fecha + x.c; let g = sesiones.find(s => s.k === k);
    if (!g) sesiones.push(g = {k, p: x.p, c: x.c, fecha: x.v.fecha, vs: []}); g.vs.push(x.v); });
  const A = D.actores;
  const tabla = (titulo, arr, cols, id) => `<div class="card"><div class="card__head"><span class="card__title">${titulo}</span><span class="card__sub">${(arr || []).length}</span></div>
    <div class="card__body"><input class="fsearch" style="width:100%;margin-bottom:8px" type="search" placeholder="Buscar nombre" data-t="${id}">
    <div class="tblwrap" style="max-height:420px;overflow:auto"><table class="dt" id="${id}"><thead><tr>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr></thead><tbody>
    ${(arr || []).map(x => `<tr data-n="${esc(x.nombre.toLowerCase())}">${cols.map(c => `<td class="${c[2] || ""}">${esc(c[0] === "proyectos" ? (x.proyectos || []).length : x[c[0]])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div></div>`;
  $("#page").innerHTML = `<div class="page__eyebrow">Votaciones y actores</div><h1 class="page__title">Cómo se ha votado y quiénes participan</h1>
    <p class="page__lead">${votos.length} votaciones en Sala de los proyectos seguidos (Senado y Cámara). Los nombres se muestran como los informa cada cámara.</p>
    <div class="card"><div class="card__head"><span class="card__title">Votaciones más recientes</span><span class="card__sub">agrupadas por proyecto y sesión</span></div><div class="card__body">
      ${sesiones.slice(0, 15).map(({p, c, fecha, vs}) => { const r = vs.filter(v => /rechaz/i.test(v.resultado || "")).length;
        return `<div class="lrow" data-b="${esc(p.boletin)}"><div class="lrow__main"><div class="lrow__t">${esc(p.nombre_corto)}</div><div class="lrow__s">Sala ${c === "Senado" ? "del Senado" : "de la Cámara"} · ${fmt(fecha)} · ${vs.length === 1 ? `${vs[0].si} a favor, ${vs[0].no} en contra` : `${vs.length} votaciones`}</div></div>
        <div class="lrow__r">${vs.length - r ? `<span class="chip p-ley">${vs.length - r} ${vs.length - r === 1 ? "aprobada" : "aprobadas"}</span>` : ""} ${r ? `<span class="chip u-di">${r} ${r === 1 ? "rechazada" : "rechazadas"}</span>` : ""}</div></div>`; }).join("")}</div></div>
    <div class="section-title">Votos por partido en los proyectos seguidos</div>
    <div class="grid g2">
      <div class="card"><div class="card__head"><span class="card__title">Sala del Senado</span><span class="card__sub">partido actual del senador</span></div><div class="card__body">${(A.partidos_senado || []).length ? tablaPartidos(A.partidos_senado, true) : '<div class="empty">Sin datos.</div>'}</div></div>
      <div class="card"><div class="card__head"><span class="card__title">Sala de la Cámara</span><span class="card__sub">militancia a la fecha de cada votación</span></div><div class="card__body">${(A.partidos_camara || []).length ? tablaPartidos(A.partidos_camara, true) : '<div class="empty">Sin datos.</div>'}</div></div>
    </div>
    <p class="small muted" style="margin-top:8px">Suma de todas las votaciones en Sala de los proyectos seguidos. "Sin información de partido" agrupa a exsenadores y a quienes no tienen militancia registrada en la fuente.</p>
    <div class="section-title">Parlamentarios</div>
    <div class="grid g2">
      ${tabla("Votos de senadores en Sala", A.votos_senadores, [["nombre","Senador/a"],["si","Sí","n"],["no","No","n"],["abstencion","Abst.","n"],["n_proyectos","Proyectos","n"]], "tSen")}
      ${tabla("Votos de diputados en Sala", A.votos_diputados, [["nombre","Diputado/a"],["si","Sí","n"],["no","No","n"],["abstencion","Abst.","n"],["n_proyectos","Proyectos","n"]], "tDip")}
      ${tabla("Autores de mociones seguidas", A.autores_mociones, [["nombre","Parlamentario/a"],["n_proyectos","Mociones","n"]], "tMoc")}
      ${tabla("Autores de indicaciones en el Senado", A.autores_indicaciones_senado, [["nombre","Autor"],["n_indicaciones","Indicaciones","n"],["n_proyectos","Proyectos","n"]], "tInd")}
    </div>`;
  document.querySelectorAll(".lrow[data-b]").forEach(r => r.addEventListener("click", () => { tabFicha = "vot"; location.hash = linkFicha(r.dataset.b); }));
  document.querySelectorAll("input[data-t]").forEach(i => i.addEventListener("input", () => { const q = i.value.toLowerCase();
    document.querySelectorAll(`#${i.dataset.t} tbody tr`).forEach(tr => tr.hidden = q && !tr.dataset.n.includes(q)); }));
}

/* ============================================================ vista 5: cambios */
function vistaCambios() {
  let soloRel = true;
  $("#page").innerHTML = `<div class="page__eyebrow">Cambios recientes</div><h1 class="page__title">Lo que cambió en la tramitación</h1>
    <p class="page__lead">El sistema compara cada hora la información oficial con la anterior y registra cada diferencia.</p>
    <div class="filterbar"><div class="seg" id="cRel"><button data-k="1" class="is-on">Cambios relevantes</button><button data-k="0">Todos, incluidos trámites menores</button></div></div>
    <div class="card"><div class="card__body" id="cLista"></div></div>`;
  const pintar = () => {
    const l = D.cambios.filter(c => !soloRel || c.tipo !== "Nuevo trámite");
    const dias = {};
    l.forEach(c => (dias[c.fecha_deteccion.slice(0, 10)] ||= []).push(c));
    $("#cLista").innerHTML = Object.entries(dias).map(([d, cs]) => `<div class="dsec__t" style="margin-top:14px">${fLarga(d)}</div>` + cs.map(c => { const p = proyecto(c.boletin);
      return `<div class="lrow" data-b="${esc(c.boletin)}"><div class="lrow__main"><div class="lrow__t">${esc(p ? p.nombre_corto : c.boletin)} <span class="mono small muted">${esc(c.boletin)}</span></div><div class="lrow__s">${esc(textoCambio(c).replace(/(\d{4}-\d{2}-\d{2})/g, m => fmt(m)))}</div></div><div class="lrow__r"><span class="tag">${esc(c.tipo)}</span></div></div>`; }).join("")).join("") || `<div class="empty">Sin cambios.</div>`;
    document.querySelectorAll("#cLista [data-b]").forEach(r => r.addEventListener("click", () => { if (proyecto(r.dataset.b)) location.hash = linkFicha(r.dataset.b); }));
  };
  document.querySelectorAll("#cRel button").forEach(b => b.addEventListener("click", () => { soloRel = b.dataset.k === "1"; document.querySelectorAll("#cRel button").forEach(x => x.classList.toggle("is-on", x === b)); pintar(); }));
  pintar();
}

/* ============================================================ vista 6: leyes y despachos */
function vistaLeyes() {
  const leyes = D.tablero.filter(p => p.situacion === "Publicado como ley").sort((a, b) => (b.ley_fecha_diario_oficial || "").localeCompare(a.ley_fecha_diario_oficial || ""));
  const desp = D.tablero.filter(p => p.situacion === "Despachado al Ejecutivo");
  const fuera = D.tablero.filter(p => ["Archivado","Retirado","Rechazado"].includes(p.situacion));
  const t = (l, cols) => `<div class="card"><div class="tblwrap"><table class="dt"><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${l.map(p => `<tr class="click" data-b="${esc(p.boletin)}">${cols.map(c => `<td>${c[1](p)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="empty">Ninguno.</td></tr>`}</tbody></table></div></div>`;
  const nom = p => `<b style="color:var(--ink)">${esc(p.nombre_corto)}</b><div class="small muted mono">${esc(p.boletin)}</div>`;
  $("#page").innerHTML = `<div class="page__eyebrow">Leyes y despachos</div><h1 class="page__title">Proyectos que terminaron su paso por el Congreso</h1>
    <p class="page__lead">Un proyecto despachado ya fue aprobado por el Congreso y espera el control del Tribunal Constitucional (si corresponde), la promulgación y la publicación en el Diario Oficial.</p>
    <div class="section-title">Despachados al Ejecutivo · ${desp.length}</div>
    ${t(desp, [["Proyecto", nom], ["Etapa", p => esc(p.etapa_texto)], ["Último trámite", p => `<span class="mono">${fmt(p.ultimo_tramite_fecha)}</span><div class="small">${esc(p.ultimo_tramite)}</div>`]])}
    <div class="section-title">Publicados como ley · ${leyes.length}</div>
    ${t(leyes, [["Proyecto", nom], ["Ley", p => `<b>${esc(p.ley_numero)}</b>`], ["Diario Oficial", p => `<span class="mono">${fmt(p.ley_fecha_diario_oficial)}</span>`], ["Materia", p => esc(p.materia)]])}
    <div class="section-title">Fuera de tramitación · ${fuera.length}</div>
    ${t(fuera, [["Proyecto", nom], ["Situación", p => esc(p.situacion)], ["Último trámite", p => `<span class="mono">${fmt(p.ultimo_tramite_fecha)}</span><div class="small">${esc(p.ultimo_tramite)}</div>`]])}`;
  document.querySelectorAll("[data-b]").forEach(r => r.addEventListener("click", () => location.hash = linkFicha(r.dataset.b)));
}

/* ============================================================ vista 7: método */

  $("#page").innerHTML = `<div class="page__eyebrow">Fuentes y método</div><h1 class="page__title">Cómo se construye cada dato</h1>
    <p class="page__lead">Toda la información de tramitación proviene de registros oficiales y se actualiza cada hora. Lo único que se define a mano es qué proyectos se siguen, su nombre corto, su materia y los campos de gestión MSP.</p>
    <div class="card"><div class="card__body" style="padding-top:16px"><div class="dsec__t">Estado de las fuentes</div><dl class="def">

      <dt>Última actualización</dt><dd>${fmt(D.meta.ultima_actualizacion_datos)} (datos nuevos) · verificado el ${fmt(D.meta.fecha_verificacion)}</dd></dl></div></div>
    <div class="section-title">Etapas del cuadro de avance</div>
    <div class="card"><div class="card__body" style="padding-top:16px"><dl class="def">
      <dt>Primer trámite</dt><dd>La cámara donde ingresó el proyecto (cámara de origen) lo estudia en comisión y lo vota en Sala, en general y en particular.</dd>
      <dt>Segundo trámite</dt><dd>La otra cámara (revisora) repite el proceso. Puede aprobarlo igual, modificarlo o rechazarlo.</dd>
      <dt>Tercer trámite</dt><dd>Solo si la revisora lo modificó: la cámara de origen vota si acepta esos cambios. Si no fue necesario, aparece como línea punteada.</dd>
      <dt>Comisión Mixta o insistencia</dt><dd>Si las cámaras no se ponen de acuerdo, una comisión con senadores y diputados propone una solución, o una cámara insiste con quórum especial.</dd>
      <dt>Control y promulgación</dt><dd>Proyecto despachado por el Congreso: control preventivo del Tribunal Constitucional cuando corresponde, eventual veto y promulgación.</dd>
      <dt>Ley</dt><dd>Publicada en el Diario Oficial con su número.</dd>
      <dt>Letra en la etapa actual</dt><dd>S: el proyecto está en el Senado. C: en la Cámara de Diputadas y Diputados. M: en Comisión Mixta. El color indica la urgencia: rojo discusión inmediata, ámbar suma, azul simple o sin urgencia.</dd></dl></div></div>
    <div class="section-title">Prioridad de gestión</div>

      <dt>Urgencia</dt><dd>Discusión inmediata +40 · suma +25 · simple +12</dd>
      <dt>Plazo</dt><dd>La urgencia vence en 7 días o menos +15</dd>
      <dt>Etapa</dt><dd>En Sala +12 · tercer trámite o Comisión Mixta +18 · segundo trámite en comisión +6</dd>
      <dt>Clasificación</dt><dd>Núcleo de seguridad +15 · conexo +5</dd>

      <dt>Urgencia con plazo cumplido</dt><dd>El plazo pasó y no hay renovación registrada.</dd>
      <dt>Urgencia sin movimiento</dt><dd>Tiene urgencia, pero no registra trámites en más de 30 días.</dd>

      <dt>Votaciones de la Cámara</dt><dd>Solo en Sala y desde 2022.</dd>

      <dt>Agenda de la Cámara</dt><dd>Sesiones de Sala citadas (datos abiertos de la Cámara) y citaciones de comisiones con materia e invitados, leídas desde camara.cl por un computador de la SPD en Chile de lunes a viernes entre 9 y 20 horas, porque ese sitio rechaza consultas desde servidores fuera de Chile.</dd>
      <dt>Plazos de urgencia</dt><dd>Son estimaciones desde el ingreso de la urgencia.</dd></dl></div></div>`;
}



/* ============================================================ calendario */
function tablaCalendario() {
  const sem = (D.calendario.semanas || []);
  if (!sem.length) return `<div class="card"><div class="empty">Calendario no disponible.</div></div>`;
  const fut = sem.filter(s => !s.pasada), pas = sem.filter(s => s.pasada).slice(-4);
  const dia = f => ["dom","lun","mar","mié","jue","vie","sáb"][new Date(f + "T12:00:00").getDay()];
  const fila = s => {
    const cam = s.camara_sala ? `${s.camara_sala} ${s.camara_sala === 1 ? "sesión" : "sesiones"} <span class="muted small">(${s.camara_dias.map(dia).join(", ")})</span>` : (s.pasada ? '<span class="muted">Sin sesiones de Sala</span>' : '<span class="muted">Sin citación publicada aún</span>');
    const sen = s.senado_sala ? `${s.senado_sala} ${s.senado_sala === 1 ? "sesión" : "sesiones"} <span class="muted small">(${s.senado_dias.map(dia).join(", ")})</span>` : (s.pasada ? '<span class="muted">Sin sesiones de Sala</span>' : '<span class="muted">Sin tabla publicada aún</span>');
    const urgs = s.urgencias_vencen || [];
    return `<tr${s.actual ? ' style="background:var(--c-blue-soft)"' : ""}><td style="white-space:nowrap;color:var(--ink);font-weight:700">${fmt(s.desde).slice(0, 5)} al ${fmt(s.hasta).slice(0, 5)}${s.actual ? ' <span class="tag">esta semana</span>' : ""}</td>
      <td>${cam}${s.camara_comisiones ? `<div class="small muted">${s.camara_comisiones} citaciones de comisiones${s.camara_comisiones_seguidos ? `, ${s.camara_comisiones_seguidos} con proyectos seguidos` : ""}</div>` : ""}</td><td>${sen}${s.senado_comisiones ? `<div class="small muted">${s.senado_comisiones} citaciones de comisiones${s.senado_comisiones_seguidos ? `, ${s.senado_comisiones_seguidos} con proyectos seguidos` : ""}</div>` : ""}</td>
      <td>${(s.feriados || []).map(f => `<div class="small">${fmt(f.fecha).slice(0, 5)} ${esc(f.nombre)}</div>`).join("") || '<span class="muted">—</span>'}</td>
      <td class="n">${urgs.length ? `<span title="${esc(urgs.map(u => (proyecto(u.boletin) || {}).nombre_corto || u.boletin).join(" · "))}">${urgs.length}</span>` : '<span class="muted">0</span>'}</td></tr>`;
  };
  return `<div class="card"><div class="tblwrap"><table class="dt"><thead><tr><th>Semana</th><th>Cámara</th><th>Senado</th><th>Feriados</th><th style="text-align:right">Urgencias que vencen</th></tr></thead>
    <tbody>${fut.map(fila).join("")}<tr><td colspan="5" class="small muted" style="background:var(--surface-2)">Semanas anteriores (sesiones realizadas)</td></tr>${pas.slice().reverse().map(fila).join("")}</tbody></table></div></div>
    <p class="small muted" style="margin-top:6px">Sesiones según los registros oficiales de cada cámara. Una semana pasada sin sesiones de Sala corresponde normalmente a semana distrital (Cámara) o regional (Senado), o a feriados. Las semanas futuras solo muestran lo ya citado: las cámaras no publican su calendario de semanas distritales y regionales en un formato que se pueda consultar automáticamente.</p>`;
}

/* ============================================================ vista: resumen para autoridades */
function vistaAutoridad() {
  const T = D.tablero, hoy = hoyISO(), tram = T.filter(enTram);
  const sem = (D.calendario.semanas || []).find(s => s.actual) || {};
  const decidir = tram.filter(p => (p.alertas || []).some(a => /Urgencia (por vencer|con plazo cumplido|renovada)|Votación rechazada/.test(a.tipo)) && ["Crítica", "Alta"].includes(p.prioridad_nivel))
    .sort((a, b) => (+b.prioridad_indice || 0) - (+a.prioridad_indice || 0)).slice(0, 8);
  const semana = sesionesSeguidas().filter(x => x.fecha >= (sem.desde || hoy) && x.fecha <= (sem.hasta || hoy) || x.fecha >= hoy).slice(0, 8);
  const hace7 = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const cambios = D.cambios.filter(c => c.tipo !== "Nuevo trámite" && c.fecha_deteccion.slice(0, 10) >= hace7);
  const hitosRel = cambios.filter(c => /Situación|Etapa|N° de ley|Nueva votación|Nuevo informe|Citado/.test(c.tipo)).slice(0, 8);
  const acot = T.filter(p => p.acot_n), acotT = acot.filter(enTram);
  const caja = (titulo, sub, cuerpo, color) => `<div class="card"><div class="card__head"><span class="card__title"${color ? ` style="color:${color}"` : ""}>${titulo}</span><span class="card__sub">${sub}</span></div><div class="card__body">${cuerpo}</div></div>`;
  $("#page").innerHTML = `
    <section class="hero"><div class="hero__k">Resumen para autoridades</div>
      <div class="hero__t">Semana del ${fmt(sem.desde || hoy).slice(0, 5)} al ${fmt(sem.hasta || hoy)}</div>
      <div class="hero__meta">Seguridad pública y prevención del delito · ${tram.length} proyectos en tramitación · datos al ${fmt(D.meta.ultima_actualizacion_datos)}</div>
      <div class="hero__stats">${[
        [decidir.length, "Requieren decisión", "prioridad crítica o alta con alerta"],
        [semana.length, "Sesiones con proyectos seguidos", "comisiones y Sala"],
        [T.filter(vence7).length, "Urgencias vencen en 7 días", "plazo estimado"],
        [hitosRel.length, "Avances en 7 días", "etapa, votación, informe, ley"],
        [`${acotT.length}/${acot.length}`, "ACOT en tramitación", `${acot.filter(p => proxSesion(p)).length} con sesión citada desde hoy`]]
        .map(([v, l, x]) => `<div class="hstat" style="cursor:default"><div class="hstat__n tnum">${v}</div><div class="hstat__l">${l}</div><div class="hstat__s">${x}</div></div>`).join("")}</div></section>
    <div class="grid g2">
      ${caja("Qué requiere decisión", "prioridad crítica o alta", decidir.length ? decidir.map(p => { const a = p.alertas.find(x => /Urgencia (por vencer|con plazo cumplido|renovada)|Votación rechazada/.test(x.tipo));
        return `<div class="lrow" data-b="${esc(p.boletin)}"><div class="lrow__main"><div class="lrow__t">${esc(p.nombre_corto)} ${p.acot_n ? `<span class="tag">ACOT ${esc(p.acot_n)}</span>` : ""}</div>
          <div class="lrow__s"><b style="color:var(--ink-2)">${esc(a.tipo)}.</b> ${esc(p.accion_sugerida)}</div></div><div class="lrow__r">${prio(p)}</div></div>`; }).join("") : '<div class="empty">Nada pendiente de decisión.</div>', "var(--c-red)")}
      ${caja("Qué pasa esta semana en el Congreso", "proyectos seguidos", semana.length ? semana.map(x => `<div class="lrow" data-b="${esc(x.seguidos[0])}"><div class="lrow__main"><div class="lrow__t">${esc(x.seguidos.map(b => (proyecto(b) || {}).nombre_corto || b).join(" · "))}</div>
          <div class="lrow__s">${esc(x.instancia)}${(x.invitados || []).length ? " · con invitados" : ""}${x.estado === "Suspendida" ? " · suspendida" : ""}</div></div><div class="lrow__r">${x.fecha === hoy ? "Hoy" : fmt(x.fecha).slice(0, 5)}<div class="small muted" style="font-weight:500">${esc((x.horario || "").split(" a ")[0])}</div></div></div>`).join("") : '<div class="empty">Sin sesiones citadas para los proyectos seguidos.</div>')}
      ${caja("Qué avanzó en los últimos 7 días", `${cambios.length} cambios relevantes`, hitosRel.length ? hitosRel.map(c => `<div class="lrow" data-b="${esc(c.boletin)}"><div class="lrow__main"><div class="lrow__t">${esc((proyecto(c.boletin) || {}).nombre_corto || c.boletin)}</div><div class="lrow__s">${esc(textoCambio(c))}</div></div><div class="lrow__r muted mono" style="font-weight:500;font-size:11px">${fmt(c.fecha_deteccion.slice(0, 10)).slice(0, 5)}</div></div>`).join("") : '<div class="empty">Sin avances registrados.</div>')}
      ${caja("Urgencias que vencen esta semana y la próxima", "plazo estimado", T.filter(p => enTram(p) && p.urgencia_vence_estimado && diasHasta(p.urgencia_vence_estimado) >= 0 && diasHasta(p.urgencia_vence_estimado) <= 14).sort((a, b) => a.urgencia_vence_estimado.localeCompare(b.urgencia_vence_estimado)).slice(0, 8)
        .map(p => `<div class="lrow" data-b="${esc(p.boletin)}"><div class="lrow__main"><div class="lrow__t">${esc(p.nombre_corto)}</div><div class="lrow__s">${esc(p.etapa_texto)}</div></div><div class="lrow__r">${urg(p.urgencia_vigente)}<div class="small" style="margin-top:3px">${fmt(p.urgencia_vence_estimado).slice(0, 5)}</div></div></div>`).join("") || '<div class="empty">Ninguna.</div>')}
    </div>
    <p class="small muted" style="margin-top:12px">Cada fila abre la ficha del proyecto. Las prioridades y acciones se calculan con las reglas de <a href="#metodologia">Fuentes y método</a>.</p>`;
  document.querySelectorAll("#page .lrow[data-b]").forEach(r => r.addEventListener("click", () => { if (proyecto(r.dataset.b)) location.hash = linkFicha(r.dataset.b); }));
}

/* ============================================================ vista: agenda de la semana */
function vistaAgenda() {
  const A = D.agenda || {}, hoy = hoyISO();
  const st = {todo: false};
  const fuentes = (D.meta.fuentes || {}).agenda || {};
  const pintar = () => {
    const items = (A.items || []).filter(x => st.todo || (x.seguidos || []).length || (x.camara !== "Senado" && x.tipo === "Sala"));
    const dias = {};
    items.forEach(x => (dias[x.fecha] ||= []).push(x));
    const sesion = x => {
      const seg = (x.seguidos || []).map(b => `<a class="pchip" href="${linkFicha(b)}">${esc((proyecto(b) || {}).nombre_corto || b)} <span class="mono" style="font-weight:500">${esc(b)}</span></a>`).join("");
      const otros = (x.boletines || []).filter(b => !(x.seguidos || []).includes(b));
      return `<div class="ses ${x.estado === "Suspendida" ? "susp" : ""}"><div class="ses__h">${esc(x.horario || "Por definir")}<small>${esc(x.camara === "Senado" ? "Senado" : "Cámara")} · ${esc(x.tipo)}</small></div>
        <div><div class="ses__i">${esc(x.instancia)} ${x.estado === "Suspendida" ? '<span class="chip u-di">Suspendida</span>' : ""}</div>
          ${x.lugar ? `<div class="small muted" style="margin-top:2px">${esc(x.lugar)}</div>` : ""}
          ${seg ? `<div>${seg}</div>` : ""}
          ${(x.invitados || []).length ? `<ul class="ses__inv">${x.invitados.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
          ${x.materia ? `<details><summary>Ver tabla completa${otros.length ? ` (${otros.length} ${otros.length === 1 ? "otro proyecto" : "otros proyectos"})` : ""}</summary><div class="ses__m">${esc(x.materia)}</div></details>` : (x.camara !== "Senado" ? `<div class="small muted" style="margin-top:6px">La Cámara no publica en datos abiertos la tabla de esta sesión.</div>` : "")}
          ${x.link ? `<a class="more" style="padding-left:0" href="${esc(x.link)}" target="_blank" rel="noopener">Documento oficial</a>` : ""}</div></div>`;
    };
    const plazos = (A.plazos_indicaciones || []).filter(p => st.todo || p.seguido);
    $("#agLista").innerHTML = (Object.keys(dias).length ? Object.entries(dias).map(([d, xs]) => `<div class="dia"><div class="dia__t ${d === hoy ? "hoy" : ""}">${d === hoy ? "Hoy · " : ""}${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date(d + "T12:00:00").getDay()]} ${fLarga(d)}${d < hoy ? ' <span class="tag">realizada</span>' : ""}</div>
      <div class="card">${xs.map(sesion).join("")}</div></div>`).join("") : `<div class="card"><div class="empty">No hay sesiones citadas${st.todo ? "" : " para los proyectos seguidos"} en este período.</div></div>`);
    $("#agPlazos").innerHTML = plazos.length ? `<div class="card"><div class="tblwrap"><table class="dt"><thead><tr><th>Vence</th><th>Proyecto</th><th>Dónde se presentan</th></tr></thead><tbody>${plazos.map(p => {
      const t = proyecto(p.boletin); return `<tr class="${t ? "click" : ""}" ${t ? `data-b="${esc(p.boletin)}"` : ""}><td class="mono" style="white-space:nowrap">${fmt(p.fecha)} ${esc(p.hora)}</td><td><b style="color:var(--ink)">${esc(t ? t.nombre_corto : p.materia)}</b><div class="small muted mono">${esc(p.boletin)}</div></td><td>${esc(p.donde)}</td></tr>`; }).join("")}</tbody></table></div></div>`
      : `<div class="card"><div class="empty">Sin plazos de indicaciones abiertos${st.todo ? "" : " para los proyectos seguidos"}.</div></div>`;
    document.querySelectorAll("#agPlazos tr[data-b]").forEach(r => r.addEventListener("click", () => location.hash = linkFicha(r.dataset.b)));
    const notas = (A.noticias_camara || []).filter(n => st.todo || n.tipo === "Tabla de la Sala" || (n.seguidos || []).length);
    $("#agCamara").innerHTML = notas.length ? `<div class="card">${notas.slice(0, 25).map(n => `<div class="ses"><div class="ses__h">${fmt(n.fecha)}<small>${esc(n.tipo)}</small></div>
      <div><div class="ses__i"><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.titulo)}</a></div>
        ${n.resumen ? `<div class="ses__m">${esc(n.resumen)}</div>` : ""}
        ${(n.seguidos || []).length ? `<div>${n.seguidos.map(b => `<a class="pchip" href="${linkFicha(b)}">${esc((proyecto(b) || {}).nombre_corto || b)}</a>`).join("")}</div>` : ""}
        ${(n.temas || []).length ? `<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${n.temas.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}</div></div>`).join("")}</div>`
      : `<div class="card"><div class="empty">Sin notas de tabla publicadas por la Cámara en las últimas semanas.</div></div>`;
  };
  const nSeg = (A.items || []).filter(x => (x.seguidos || []).length && x.fecha >= hoy).length;
  setTimeout(() => { const el = $("#agCal"); if (el) el.innerHTML = tablaCalendario(); }, 0);
  $("#page").innerHTML = `<div class="page__eyebrow">Agenda de la semana</div><h1 class="page__title">Qué se discute y quiénes asisten</h1>
    <p class="page__lead">${nSeg} sesiones citadas desde hoy tratan proyectos seguidos. Se muestran las citaciones de comisiones del Senado con su materia e invitados, la tabla de la Sala del Senado, las sesiones de Sala de la Cámara y los plazos para presentar indicaciones. Se actualiza cada hora.</p>
    <div class="filterbar"><div class="seg" id="agTodo"><button type="button" data-k="0" class="is-on">Solo proyectos seguidos</button><button type="button" data-k="1">Toda la agenda</button></div>
      <span class="fcount">Desde el ${fmt(A.desde || hoy)}${fuentes.estado && fuentes.estado !== "ok" ? " · algunas fuentes sin conexión; se muestran los últimos datos obtenidos" : ""}</span></div>
    <div class="section-title">Calendario de las próximas semanas</div>
    <div id="agCal"></div>
    <div class="section-title">Sesiones citadas</div>
    <div id="agLista"></div>
    <div class="section-title">Plazos para presentar indicaciones</div><div id="agPlazos"></div>
    <div class="section-title">Cámara: tabla anunciada y trabajo en comisiones</div>
    <div class="notebar">Notas que publica la prensa de la Cámara: cada semana anuncia la tabla de la Sala y da cuenta del trabajo de las comisiones. Se muestran el título, el resumen y el enlace a la nota completa. Con "Toda la agenda" se ven también las notas de comisiones.</div>
    <div id="agCamara"></div>
    <div class="notebar" style="margin-top:16px">${(() => { const e = ((D.meta.fuentes || {}).agenda || {}).detalle || {}; const c = e.camara_comisiones;
      return c ? `Citaciones de comisiones de la Cámara leídas desde camara.cl por un computador de la SPD en Chile (última lectura: ${fmt(c.actualizado)}${c.estado === "ok" ? "" : "; sin actualizar recientemente"}).`
        : "Las citaciones de comisiones de la Cámara se incorporan cuando el computador de la SPD en Chile las lee desde camara.cl (lunes a viernes, de 9 a 20 horas)."; })()}</div>`;
  document.querySelectorAll("#agTodo button").forEach(b => b.addEventListener("click", () => { st.todo = b.dataset.k === "1"; document.querySelectorAll("#agTodo button").forEach(x => x.classList.toggle("is-on", x === b)); pintar(); }));
  pintar();
}

/* ============================================================ vista: agenda ACOT */
function vistaAcot() {
  const ac = D.acot || [], conB = ac.filter(a => a.boletin && proyecto(a.boletin)), sinB = ac.filter(a => !a.boletin || !proyecto(a.boletin));
  const lista = conB.map(a => proyecto(a.boletin)).filter((p, i, arr) => arr.indexOf(p) === i);
  const tram = lista.filter(enTram), fin = lista.filter(p => ["Despachado al Ejecutivo","Publicado como ley"].includes(p.situacion));
  const iniciativa = b => { const a = ac.find(x => x.boletin === b); return a ? `N° ${a.n_acot} · ${a.iniciativa}` : ""; };
  const ordenAcot = (x, y) => { const k = n => /^\d+$/.test(n) ? +n : n.startsWith("N") ? 100 + +n.slice(1) : 200; return k(x.acot_n) - k(y.acot_n); };
  $("#page").innerHTML = `<div class="page__eyebrow">Agenda ACOT</div><h1 class="page__title">Agenda contra el Crimen Organizado y el Terrorismo</h1>
    <p class="page__lead">${ac.length} iniciativas según el listado del Ministerio de Seguridad Pública (06-08-2026): ${conB.length} con boletín en seguimiento y ${sinB.length} sin boletín identificado o aún no ingresadas al Congreso.</p>
    <section class="hero" style="padding:14px 20px 16px"><div class="hero__stats" style="margin-top:0">
      ${[[ac.length, "Iniciativas ACOT", "listado del Ministerio"], [tram.length, "En tramitación", `${tram.filter(p => p.urgencia_vigente === "Discusión inmediata").length} con discusión inmediata`],
         [fin.length, "Despachadas o ley", "terminaron en el Congreso"], [lista.filter(p => proxSesion(p)).length, "Citadas esta semana", "comisión o Sala"], [sinB.length, "Sin boletín", "anunciadas o por identificar"]]
        .map(([v, l, x]) => `<div class="hstat" style="cursor:default"><div class="hstat__n tnum">${v}</div><div class="hstat__l">${l}</div><div class="hstat__s">${x}</div></div>`).join("")}</div></section>
    <div class="section-title">Avance de los proyectos ACOT</div>
    <div id="acotTabla"></div>
    <div class="section-title">Iniciativas sin boletín en seguimiento · ${sinB.length}</div>
    <div class="card"><div class="tblwrap"><table class="dt"><thead><tr><th>N°</th><th>Iniciativa</th><th>Grupo</th><th>Estado</th></tr></thead><tbody>
      ${sinB.map(a => `<tr><td class="mono">${esc(a.n_acot)}</td><td><b style="color:var(--ink)">${esc(a.iniciativa)}</b>${a.nota ? `<div class="small muted">${esc(a.nota)}</div>` : ""}</td><td>${esc(a.grupo)}</td><td>${esc(a.estado_boletin || "Boletín fuera del seguimiento")}</td></tr>`).join("")}
    </tbody></table></div></div>
    <p class="small muted" style="margin-top:10px">Cuando el Gobierno ingrese una de estas iniciativas, el sistema la detecta como proyecto nuevo y se agrega al seguimiento y a esta vista.</p>`;
  $("#acotTabla").innerHTML = tablaAvance([...lista].sort(ordenAcot), false);
  document.querySelectorAll("#acotTabla tbody tr[data-b]").forEach(tr => {
    tr.addEventListener("click", () => location.hash = linkFicha(tr.dataset.b));
    const b = tr.querySelector(".pname b"); if (b) b.insertAdjacentHTML("afterend", `<small class="muted" style="display:block;font-size:11px;margin-top:2px">${esc(iniciativa(tr.dataset.b))}</small>`);
  });
}

/* ============================================================ accesibilidad (Kit Digital) */
function a11y() {
  const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let zoom = parseFloat(leer("zoom") || "1") || 1;
  const aplicar = () => { document.documentElement.style.setProperty("--zoom", zoom); };
  $("#aMas").addEventListener("click", () => { zoom = Math.min(1.4, +(zoom + 0.1).toFixed(2)); aplicar(); guardar("zoom", zoom); });
  $("#aMenos").addEventListener("click", () => { zoom = Math.max(0.9, +(zoom - 0.1).toFixed(2)); aplicar(); guardar("zoom", zoom); });
  const con = leer("contraste") === "1";
  document.documentElement.classList.toggle("contraste", con); $("#aCon").setAttribute("aria-pressed", con);
  $("#aCon").addEventListener("click", () => { const on = !document.documentElement.classList.contains("contraste");
    document.documentElement.classList.toggle("contraste", on); $("#aCon").setAttribute("aria-pressed", on); guardar("contraste", on ? "1" : "0"); });
  aplicar();
}

/* ============================================================ inicio */
(async () => {
  const [t, m, c, ag, ac, cal] = await Promise.all([cargar("data/tablero.json", []), cargar("data/meta.json", {}), cargar("data/cambios.json", []),
    cargar("data/agenda.json", {items: [], plazos_indicaciones: []}), cargar("data/acot.json", []), cargar("data/calendario.json", {semanas: []})]);
  Object.assign(D, {tablero: t, meta: m, cambios: c, agenda: ag, acot: ac, calendario: cal});
  if (!t.length) { $("#page").innerHTML = `<div class="empty">No se pudieron cargar los datos. Esta página debe abrirse desde GitHub Pages o un servidor web.</div>`; return; }
  const f = m.fuentes || {}, ok = k => (f[k] && (f[k].estado || "").startsWith("ok"));
  $("#corte").innerHTML = `<span class="dot" style="background:${ok("senado") && ok("camara_votaciones") ? "var(--c-ok)" : "var(--c-amber)"}"></span>Actualizado ${fmt(m.ultima_actualizacion_datos)}`;
  $("#fuentes").innerHTML = `<div class="src"><span class="dot" style="background:${ok("senado") ? "#5fd39a" : "#ff9a9f"}"></span>Senado ${ok("senado") ? "al día" : "sin conexión"}</div>
    <div class="src"><span class="dot" style="background:${ok("camara_votaciones") ? "#5fd39a" : "#ff9a9f"}"></span>Cámara ${ok("camara_votaciones") ? "al día" : "sin conexión"}</div>
    <div style="margin-top:6px">Datos al ${fmt(m.ultima_actualizacion_datos)}. Se actualiza cada hora.</div>`;
  a11y();
  ruta();
  setTimeout(proyectos, 1200);   // la ficha completa se precarga en segundo plano
})();
