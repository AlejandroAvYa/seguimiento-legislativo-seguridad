name: Explorar fuentes (diagnóstico)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: xvfb-run -a python scripts/explorar_fuentes.py
      - run: python scripts/explorar_fuentes.py --headless
