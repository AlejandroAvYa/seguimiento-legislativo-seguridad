name: Actualizar proyectos de ley

on:
  schedule:
    - cron: "17 * * * *"      # cada hora, al minuto 17 (hora UTC)
  workflow_dispatch:           # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write              # para guardar los datos actualizados
  issues: write                # para avisar candidatos nuevos

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  actualizar:
    # Por defecto corre en los servidores de GitHub. Para usar un computador propio en Chile,
    # crear la variable del repositorio EJECUTOR con el valor self-hosted (ver README).
    runs-on: ${{ vars.EJECUTOR || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      ALERTA_DESTINATARIOS: ${{ secrets.ALERTA_DESTINATARIOS }}
      ALERTA_SMTP_HOST: ${{ secrets.ALERTA_SMTP_HOST }}
      ALERTA_SMTP_PUERTO: ${{ secrets.ALERTA_SMTP_PUERTO }}
      ALERTA_SMTP_USUARIO: ${{ secrets.ALERTA_SMTP_USUARIO }}
      ALERTA_SMTP_CLAVE: ${{ secrets.ALERTA_SMTP_CLAVE }}
      ALERTA_REMITENTE: ${{ secrets.ALERTA_REMITENTE }}
      ALERTA_TEAMS_WEBHOOK: ${{ secrets.ALERTA_TEAMS_WEBHOOK }}
      ALERTA_URL_DASHBOARD: ${{ vars.URL_DASHBOARD }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: Consultar Senado y Cámara y actualizar datos
        id: datos
        run: python scripts/actualizar.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "Datos actualizados $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
          # reintenta si otra tarea guardó cambios al mismo tiempo
          for intento in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done
          exit 1

      - name: Avisar cambios relevantes (correo / Teams)
        continue-on-error: true
        run: python scripts/alertas.py --cambios

      - name: Avisar candidatos nuevos (issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f salida/alerta_candidatos.md ]; then
            # reintenta si la API de GitHub falla de forma transitoria
            for intento in 1 2 3; do
              if gh issue create \
                --title "Candidatos nuevos para revisar ($(TZ=America/Santiago date '+%d-%m-%Y'))" \
                --body-file salida/alerta_candidatos.md; then
                break
              fi
              if [ "$intento" = 3 ]; then exit 1; fi
              echo "Falló la creación del issue (intento $intento); se reintenta en 20 s."
              sleep 20
            done
          else
            echo "No hay candidatos nuevos."
          fi

      - name: Revisar el estado del sistema (abre o cierra el aviso automático)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ steps.datos.outcome }}
        run: python scripts/salud.py
